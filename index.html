<style>
  :root{
    color-scheme: light;
    --bg:#F0F2EA;
    --surface:#FFFFFF;
    --surface-2:#E7EBDF;
    --ink:#1D2118;
    --ink-soft:#565F4C;
    --ink-faint:#8A9179;
    --line:#C3CAB4;
    --line-strong:#9FA88C;
    --songshan-tint-strong:#B9CB9E;
    --songshan-text:#4B5E36;
    --xinyi-tint-strong:#DDC08A;
    --xinyi-text:#7A5A22;
    --cta:#2a5c4a;
    --cta-text:#F4F7F1;
    --shift-1:#2a78d6; /* 早班 */
    --shift-2:#eb6834; /* 中班 */
    --shift-3:#1baf7a; /* 晚班 */
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow: 0 1px 2px rgba(29,33,24,0.06), 0 10px 28px -14px rgba(29,33,24,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#14160F; --surface:#1B1E15; --surface-2:#242818;
      --ink:#ECEEE3; --ink-soft:#B7BEA6; --ink-faint:#7C8468;
      --line:#3A4030; --line-strong:#4E5740;
      --songshan-tint-strong:#3B4C28; --songshan-text:#B7D69A;
      --xinyi-tint-strong:#544117; --xinyi-text:#E3BE72;
      --cta:#3FA080; --cta-text:#0E1410;
      --shift-1:#3987e5; --shift-2:#d95926; --shift-3:#199e70;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#14160F; --surface:#1B1E15; --surface-2:#242818;
    --ink:#ECEEE3; --ink-soft:#B7BEA6; --ink-faint:#7C8468;
    --line:#3A4030; --line-strong:#4E5740;
    --songshan-tint-strong:#3B4C28; --songshan-text:#B7D69A;
    --xinyi-tint-strong:#544117; --xinyi-text:#E3BE72;
    --cta:#3FA080; --cta-text:#0E1410;
    --shift-1:#3987e5; --shift-2:#d95926; --shift-3:#199e70;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;}
  .page{max-width:1220px;margin:0 auto;padding:28px 20px 64px;}
  h1,h2{font-family:'Noto Serif TC','Songti TC',serif;font-weight:700;margin:0;text-wrap:balance;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
  a{color:inherit;}

  header.hero{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}
  header.hero h1{font-size:clamp(22px,3.4vw,30px);}

  nav.day-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:thin;}
  nav.day-strip::-webkit-scrollbar{height:6px;}
  nav.day-strip::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
  .day-btn{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 13px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);}
  .day-btn:hover{border-color:var(--line-strong);}
  .day-btn .d{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .day-btn .w{font-size:11px;color:var(--ink-faint);margin-left:4px;}
  .day-btn .dots{display:flex;gap:4px;margin-top:6px;}
  .day-btn .dots span{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .day-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);}
  .day-btn[aria-pressed="true"] .d,.day-btn[aria-pressed="true"] .w{color:var(--bg);}
  .day-btn[aria-pressed="true"] .w{opacity:.6;}

  .today-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 16px;margin:0 0 22px;font-size:13.5px;}
  .today-bar .lbl{font-family:'IBM Plex Mono',monospace;color:var(--ink-faint);font-size:11.5px;letter-spacing:.05em;}
  .today-bar .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 8px;font-weight:600;}
  .today-bar .chip .sw{width:8px;height:8px;border-radius:50%;}
  .today-bar .arrow{color:var(--ink-faint);}

  .section-head{margin:0 0 4px;}
  .section-head h2{font-size:22px;}
  .section-head .lede{font-size:13.5px;color:var(--ink-soft);margin:6px 0 0;line-height:1.75;max-width:76ch;}

  .zone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:18px;}
  .zone-card{position:relative;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow);padding:17px;display:flex;flex-direction:column;gap:11px;transition:outline-color .15s;}
  .zone-card[data-active="true"]{outline:2px solid var(--ink);outline-offset:1px;}
  .active-badge{position:absolute;top:-11px;left:16px;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em;}
  .shift-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-soft);}
  .shift-legend .item{display:flex;align-items:center;gap:6px;}
  .shift-legend .swatch{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .zone-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .zone-name{font-size:20px;font-weight:700;}
  .zone-oldname{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .district-tag{font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap;}
  .district-tag.songshan{background:var(--songshan-tint-strong);color:var(--songshan-text);}
  .district-tag.xinyi{background:var(--xinyi-tint-strong);color:var(--xinyi-text);}
  .li-count{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .li-count b{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-size:14px;}

  .cta-row{display:flex;flex-wrap:wrap;gap:8px;}
  .cta-btn{flex:1;min-width:140px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--cta);color:var(--cta-text);text-decoration:none;font-weight:700;font-size:13px;border-radius:var(--radius-sm);padding:10px 12px;border:none;}
  .cta-btn:hover{opacity:.92;}
  .cta-btn svg{width:14px;height:14px;flex:0 0 auto;}

  .li-toggle{background:none;border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 10px;font-family:inherit;font-size:12.5px;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
  .li-toggle .car{transition:transform .15s;}
  .li-toggle[aria-expanded="true"] .car{transform:rotate(180deg);}
  .li-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-soft);}
  .li-list[hidden]{display:none;}
  .li-list li{display:flex;gap:8px;border-top:1px dashed var(--line);padding-top:5px;}
  .li-list li:first-child{border-top:none;padding-top:0;}
  .li-list .li-idx{font-family:'IBM Plex Mono',monospace;color:var(--ink-faint);flex:0 0 18px;}
  .li-list .li-name{font-weight:600;color:var(--ink);flex:0 0 44px;}
  .li-list .li-addr{flex:1;}

  .landmark-wrap{font-size:11.5px;color:var(--ink-faint);}
  .landmark-title{font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip-sm{background:var(--surface-2);border-radius:999px;padding:3px 9px;}
</style>
</head>

    <h1>松山・信義次分區巡迴路線</h1>

      <span class="item"><span class="swatch" style="background:var(--shift-3)"></span>晚班</span>
    </div>
  </div>

</div>

      li:[{n:"景聯",a:"臺北市信義區吳興街106巷9號"},{n:"景勤",a:"臺北市信義區信安街15巷46弄6號"},{n:"雙和",a:"臺北市信義區吳興街284巷24弄16號"},{n:"嘉興",a:"臺北市信義區嘉興街175巷6號"},{n:"黎順",a:"臺北市信義區崇德街15號"},{n:"黎平",a:"臺北市信義區富陽街55巷9號"},{n:"黎忠",a:"臺北市信義區和平東路三段391巷16號"},{n:"黎安",a:"臺北市信義區和平東路3段627巷41弄8之1號"}],
      legs:[{label:"全區巡迴（8里）",url:"https://www.google.com/maps/dir/%E8%87%BA%E5%8C%97%E5%B8%82%E4%BF%A1%E7%BE%A9%E5%8D%80%E5%90%B3%E8%88%88%E8%A1%97106%E5%B7%B79%E8%99%9F/%E8%87%BA%E5%8C%97%E5%B8%82%E4%BF%A1%E7%BE%A9%E5%8D%80%E4%BF%A1%E5%AE%89%E8%A1%9715%E5%B7%B746%E5%BC%846%E8%99%9F/%E8%87%BA%E5%8C%97%E5%B8%82%E4%BF%A1%E7%BE%A9%E5%8D%80%E5%90%B3%E8%88%88%E8%A1%97284%E5%B7%B724%E5%BC%8416%E8%99%9F/%E8%87%BA%E5%8C%97%E5%B8%82%E4%BF%A1%E7%BE%A9%E5%8D%80%E5%98%89%E8%88%88%E8%A1%97175%E5%B7%B76%E8%99%9F/%E8%87%BA%E5%8C%97%E5%B8%82%E4%BF%A1%E7%BE%A9%E5%8D%80%E5%B4%87%E5%BE%B7%E8%A1%9715%E8%99%9F/%E8%87%BA%E5%8C%97%E5%B8%82%E4%BF%A1%E7%BE%A9%E5%8D%80%E5%AF%8C%E9%99%BD%E8%A1%9755%E5%B7%B79%E8%99%9F/%E8%87%BA%E5%8C%97%E5%B8%82%E4%BF%A1%E7%BE%A9%E5%8D%80%E5%92%8C%E5%B9%B3%E6%9D%B1%E8%B7%AF%E4%B8%89%E6%AE%B5391%E5%B7%B716%E8%99%9F/%E8%87%BA%E5%8C%97%E5%B8%82%E4%BF%A1%E7%BE%A9%E5%8D%80%E5%92%8C%E5%B9%B3%E6%9D%B1%E8%B7%AF3%E6%AE%B5627%E5%B7%B741%E5%BC%848%E4%B9%8B1%E8%99%9F"}]}
  };

  var ZONE_ORDER = ["東社","三民","中崙","本鎮","三張犁","五分埔","福德","吳興","六張犁"];

  var SHIFT_META = {
    '早班': {color:'var(--shift-1)'},
    '中班': {color:'var(--shift-2)'},
    '晚班': {color:'var(--shift-3)'}
  };

  var SCHEDULE = [
    {date:'9/3',  wd:'四', stops:[{shift:'早班',zone:'三民'},  {shift:'中班',zone:'東社'},  {shift:'晚班',zone:'本鎮'}]},
    {date:'9/4',  wd:'五', stops:[{shift:'早班',zone:'中崙'},  {shift:'中班',zone:'三張犁'},{shift:'晚班',zone:'五分埔'}]},
    {date:'9/5',  wd:'六', stops:[{shift:'早班',zone:'福德'},  {shift:'中班',zone:'吳興'},  {shift:'晚班',zone:'六張犁'}]},
    {date:'9/6',  wd:'日', stops:[{shift:'早班',zone:'本鎮'},  {shift:'中班',zone:'三民'},  {shift:'晚班',zone:'東社'}]},
    {date:'9/7',  wd:'一', stops:[{shift:'早班',zone:'五分埔'},{shift:'中班',zone:'中崙'},  {shift:'晚班',zone:'三張犁'}]},
    {date:'9/8',  wd:'二', stops:[{shift:'早班',zone:'六張犁'},{shift:'中班',zone:'福德'},  {shift:'晚班',zone:'吳興'}]},
    {date:'9/9',  wd:'三', stops:[{shift:'早班',zone:'東社'},  {shift:'中班',zone:'本鎮'},  {shift:'晚班',zone:'三民'}]},
    {date:'9/10', wd:'四', stops:[{shift:'早班',zone:'三張犁'},{shift:'中班',zone:'五分埔'},{shift:'晚班',zone:'中崙'}]},
    {date:'9/11', wd:'五', stops:[{shift:'早班',zone:'吳興'},  {shift:'中班',zone:'六張犁'},{shift:'晚班',zone:'福德'}]},
    {date:'9/12', wd:'六', stops:[{shift:'早班',zone:'三民'},  {shift:'中班',zone:'東社'},  {shift:'晚班',zone:'本鎮'}]}
  ];

  var mapPin = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1c-3.3 0-6 2.6-6 6 0 4.4 6 12 6 12s6-7.6 6-12c0-3.4-2.7-6-6-6zm0 8.3A2.3 2.3 0 1 1 10 4.7a2.3 2.3 0 0 1 0 4.6z"/></svg>';

  var zoneGrid = document.getElementById('zoneGrid');
  var dayStrip = document.getElementById('dayStrip');
  var todayBar = document.getElementById('todayBar');
  var cardEls = {};

  ZONE_ORDER.forEach(function(name){
    var z = ZONE_DATA[name];
    var card = document.createElement('div');
    card.className = 'zone-card';

    var tagClass = z.district === '松山' ? 'songshan' : 'xinyi';

    var ctaHtml = z.legs.map(function(leg){
      return '<a class="cta-btn" href="'+leg.url+'" target="_blank" rel="noopener">' + mapPin + '<span>' + leg.label + '</span></a>';
    }).join('');

    var liHtml = z.li.map(function(li, idx){
      return '<li><span class="li-idx mono">'+(idx+1)+'</span><span class="li-name">'+li.n+'里</span><span class="li-addr">'+li.a+'</span></li>';
    }).join('');

    var lmHtml = z.landmarks.length ? (
      '<div class="landmark-wrap"><div class="landmark-title">重要地標（沿途參考，非停靠站）</div><div class="chips">' +
      z.landmarks.map(function(l){ return '<span class="chip-sm">'+l+'</span>'; }).join('') +
      '</div></div>'
    ) : '';

    card.innerHTML =
      '<div class="zone-head">' +
        '<div><div class="zone-name">'+name+'次分區</div><div class="zone-oldname">固有地名：'+z.oldname+'</div></div>' +
        '<span class="district-tag '+tagClass+'">'+z.district+'區</span>' +
      '</div>' +
      '<div class="li-count">里別覆蓋 <b>'+z.li.length+'</b> 里（全數納入路線）</div>' +
      '<div class="cta-row">'+ctaHtml+'</div>' +
      '<button class="li-toggle" aria-expanded="false" type="button">' +
        '<span>顯示 '+z.li.length+' 里巡迴清單</span><span class="car">▾</span>' +
      '</button>' +
      '<ol class="li-list" hidden>'+liHtml+'</ol>' +
      lmHtml;

    zoneGrid.appendChild(card);
    cardEls[name] = card;

    var toggleBtn = card.querySelector('.li-toggle');
    var liList = card.querySelector('.li-list');
    toggleBtn.addEventListener('click', function(){
      var expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
      toggleBtn.setAttribute('aria-expanded', String(!expanded));
      liList.hidden = expanded;
      toggleBtn.querySelector('span').textContent = expanded ? ('顯示 '+z.li.length+' 里巡迴清單') : '收合里別清單';
    });
  });

  // ---- day strip ----
  SCHEDULE.forEach(function(day, i){
    var btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    btn.innerHTML = '<span class="d">'+day.date+'</span><span class="w">('+day.wd+')</span><div class="dots">' +
      day.stops.map(function(s){ return '<span style="background:'+SHIFT_META[s.shift].color+'"></span>'; }).join('') +
      '</div>';
    btn.addEventListener('click', function(){ selectDay(i); });
    dayStrip.appendChild(btn);
  });

  function selectDay(i){
    var day = SCHEDULE[i];

    Array.prototype.forEach.call(dayStrip.children, function(btn, idx){
      btn.setAttribute('aria-pressed', idx === i ? 'true' : 'false');
    });

    todayBar.innerHTML = '<span class="lbl">'+day.date+'（星期'+day.wd+'）今日路線</span>' + day.stops.map(function(s, idx){
      var meta = SHIFT_META[s.shift];
      return (idx>0 ? '<span class="arrow">→</span>' : '') +
        '<span class="chip"><span class="sw" style="background:'+meta.color+'"></span>'+s.shift+' '+s.zone+'（'+ZONE_DATA[s.zone].district+'）</span>';
    }).join('');

    ZONE_ORDER.forEach(function(name){
      var card = cardEls[name];
      var existingBadge = card.querySelector('.active-badge');
      if (existingBadge) existingBadge.remove();
      var stop = day.stops.find(function(s){ return s.zone === name; });
      if (stop){
        card.dataset.active = 'true';
        var meta = SHIFT_META[stop.shift];
        var b = document.createElement('span');
        b.className = 'active-badge';
        b.style.background = meta.color;
        b.textContent = day.date + ' ' + stop.shift;
        card.appendChild(b);
      } else {
        card.dataset.active = 'false';
      }
    });
  }

  selectDay(0);
})();
</script>

</body>
</html>
